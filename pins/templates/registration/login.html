<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Zeecomedia Pins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',ui-sans-serif,system-ui;}</style>
</head>
<body class="flex h-full items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="mb-8 flex flex-col items-center gap-3 text-center">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#e60023] text-lg font-extrabold text-white shadow-lg shadow-[#e60023]/30">Z</div>
            <div>
                <p class="text-base font-bold text-white">Zeecomedia</p>
                <p class="text-xs text-slate-400">Pinterest Content Manager</p>
            </div>
        </div>

        <div class="rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur">
            {% if form.errors %}
            <div class="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 px-3.5 py-2.5 text-xs text-rose-300">
                Incorrect username or password. Please try again.
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="mb-1.5 block text-xs font-semibold text-slate-300">Username</label>
                    <input type="text" name="username" required autofocus
                           class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white placeholder:text-slate-500 focus:border-[#e60023] focus:ring-4 focus:ring-[#e60023]/20 focus:outline-none">
                </div>
                <div class="mb-5">
                    <label class="mb-1.5 block text-xs font-semibold text-slate-300">Password</label>
                    <input type="password" name="password" required
                           class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white placeholder:text-slate-500 focus:border-[#e60023] focus:ring-4 focus:ring-[#e60023]/20 focus:outline-none">
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="w-full rounded-xl bg-[#e60023] py-2.5 text-sm font-semibold text-white shadow-lg shadow-[#e60023]/30 transition hover:bg-[#c8001d]">
                    Sign in
                </button>
            </form>
        </div>
        <p class="mt-6 text-center text-[11px] text-slate-500">© {% now "Y" %} Zeecomedia Tech Enterprises</p>
    </div>
</body>
</html>
