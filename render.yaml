services:
  # --- Web dashboard ---
  - type: web
    name: zeecomedia-pinterest-dashboard
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # Default gunicorn = 1 worker, 30s timeout: one slow upload/AI generation blocks the
    # whole site and anything over 30s is killed. Threads let requests overlap.
    startCommand: "gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false        # paste your Supabase pooler connection string in the Render dashboard
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: SITE_BASE_URL
        sync: false        # your public Render URL, e.g. https://zeecomedia-pinterest-dashboard.onrender.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ALERT_EMAIL_FALLBACK
        sync: false
      - key: DASHBOARD_USER           # Basic Auth login for the dashboard
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false

  # --- Auto-post cron job ---
  # Each active window (morning/afternoon/evening) gets ONE randomly chosen
  # posting time per day, picked automatically the first time it's checked.
  # Because the exact minute is random, this job must run frequently enough
  # to catch it — every 15 minutes below. It's a no-op most of the time
  # (just checks the clock and exits), so this stays well under Render's
  # $1/month cron minimum regardless of how often it fires.
  - type: cron
    name: zeecomedia-pinterest-auto-post
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_auto_post"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false        # use the SAME value as the web service so both share config consistently
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false        # MUST be the SAME Supabase DB as the web service — this is how they share AutomationSettings/PinContent
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: SITE_BASE_URL
        sync: false        # your public Render URL — only needed if NOT using Supabase Storage for images
      # --- Added: the cron job runs run_auto_post in its OWN environment, so it needs
      # every secret the posting code touches, not just the database URL. ---
      - key: PINTEREST_CLIENT_ID      # needed to refresh the Pinterest access token
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false
      - key: USE_SUPABASE_STORAGE     # so pin.image resolves to the public Supabase URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: GEMINI_API_KEY           # only if overlay_title_on_image uses Gemini
        sync: false
      # Brevo SMTP for failure alert emails
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ALERT_EMAIL_FALLBACK
        sync: false
